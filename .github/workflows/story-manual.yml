name: story-manual (ページ指定ですぐ投稿)

on:
  # クロさんが stories/post_now.json を書き換えてpushすると、その場で投稿する
  push:
    branches: [main]
    paths: ['stories/post_now.json']
  workflow_dispatch:
    inputs:
      page:
        description: 'ページ番号（例: 6）またはページID'
        type: string
        required: false
      dry_run:
        description: 'ドライラン（投稿せず内容表示のみ）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rutto-story-manual
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish story (manual)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          SLOT: manual
          PAGE: ${{ inputs.page }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python3 scripts/publish_story.py

      - name: Commit state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "rutto-autopost-bot"
          git config user.email "actions@github.com"
          git add state/ stories/post_now.json
          git diff --cached --quiet || (git commit -m "story manual posted $(TZ=Asia/Tokyo date +%F)" && git pull --rebase origin main && git push)
